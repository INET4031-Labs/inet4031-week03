# AFTER fixes (credentials in Secret, RollingUpdate strategy):
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flask
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        io.kompose.service: flask
    spec:
      containers:
      - name: flask
        image: TODO  # Replace with actual Flask image from week-2/app
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: flask-credentials
        # Remove any inline env: entries for database credentials
